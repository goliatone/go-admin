<!-- Logo/Icon -->
<div class="flex justify-center" data-login-logo>
  {% if theme and theme.assets and theme.assets.icon %}
  {# Square icon - display in rounded container #}
  <div class="w-16 h-16 bg-admin-dark rounded-2xl flex items-center justify-center shadow-lg">
    <img src="{{ theme.assets.icon }}" alt="Logo" class="w-10 h-10 object-contain" />
  </div>
  {% elif theme and theme.assets and theme.assets.logo %}
  {# Rectangular logo - display without container, auto-size #}
  <div class="flex items-center justify-center">
    <img src="{{ theme.assets.logo }}" alt="Logo" class="h-12 max-w-[200px] object-contain" />
  </div>
  {% else %}
  {# Default fallback icon #}
  <div class="w-16 h-16 bg-admin-dark rounded-2xl flex items-center justify-center shadow-lg">
