<div class="inline-flex rounded-xl border border-gray-200 overflow-hidden bg-white">
  <a
    href="{{ media_gallery_path }}"
    class="px-4 py-2.5 text-sm font-medium {% if media_view == "grid" %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %}"
  >
    <i class="iconoir-view-grid mr-2"></i>Grid
  </a>
  <a
    href="{{ media_list_path }}"
    class="px-4 py-2.5 text-sm font-medium border-l border-gray-200 {% if media_view == "list" %}bg-gray-900 text-white{% else %}text-gray-600 hover:bg-gray-50{% endif %}"
  >
    <i class="iconoir-list mr-2"></i>List
  </a>
</div>
<input type="file" class="hidden" data-media-upload-input multiple>
<button type="button" class="btn btn-primary" data-media-upload-trigger>
  <i class="iconoir-upload mr-2"></i>Upload
</button>
